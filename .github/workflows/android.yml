# Songhub Offline - GitHub Actions build
# Gumagawa ng APK tuwing may push. I-download sa: Actions tab -> pinakabagong run -> Artifacts.
#
# PHONE-FRIENDLY: Kung ZIP lang ang na-upload mo sa repo (hal. SonghubOffline.zip),
# awtomatiko itong ia-unzip bago i-build.
name: Build Songhub APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project kung ZIP ang na-upload
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Walang Android project o ZIP file sa repo."; exit 1
            fi
            echo "Ina-unzip ang $ZIP ..."
            unzip -q -o "$ZIP" -d _unzipped
            SETTINGS=$(find _unzipped \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
            cp -a "$(dirname "$SETTINGS")"/. .
            rm -rf _unzipped
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Walang gradle-wrapper.jar - gagamitin ang naka-install na Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonghubOffline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
